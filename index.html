<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Fiszki IT – Słownictwo z zeszytu</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2a2a2a;
            --border: #3d3d3d;
            --text: #e0e0e0;
            --text-muted: #9a9a9a;
            --text-dim: #6e6e6e;

            --text-en: #f5f5f5;
            --text-pl: #c8c8c8;

            --accent: #5eb8e8;
            --accent-hover: #3d9fd4;
            --accent-soft: rgba(94, 184, 232, 0.12);
            --accent-border: rgba(94, 184, 232, 0.35);

            --success: #4a9d6a;
            --success-bg: rgba(74, 157, 106, 0.18);
            --success-border: #4a9d6a;
            --danger: #c75450;
            --danger-bg: rgba(199, 84, 80, 0.18);
            --danger-border: #c75450;

            --radius: 10px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(1rem + var(--safe-top)) 0.75rem calc(1.5rem + var(--safe-bottom));
            overscroll-behavior-y: contain;
            touch-action: manipulation;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            z-index: 100;
            box-shadow: 0 0 12px rgba(94, 184, 232, 0.5);
        }

        h1 {
            margin-bottom: 1rem;
            font-weight: 600;
            color: var(--text);
            text-align: center;
            font-size: clamp(1.1rem, 4.5vw, 1.5rem);
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        h1 svg { flex-shrink: 0; color: var(--accent); }

        .container { width: 100%; max-width: 900px; }

        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab {
            flex: 1 1 auto;
            min-height: 44px;
            padding: 0.5rem 0.7rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            font-size: clamp(0.7rem, 2.8vw, 0.9rem);
            font-family: inherit;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }
        .tab svg { flex-shrink: 0; }
        .tab.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent-border);
            font-weight: 600;
        }
        .tab.active svg { color: var(--accent); }
        .tab:active:not(.active) { transform: scale(0.97); }
        .tab:hover:not(.active) {
            border-color: var(--accent-border);
            color: var(--text);
        }

        .panel { display: none; }
        .panel.active { display: block; }

        .word-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .word-item {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.85rem 0.9rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.2s;
            min-height: 60px;
            position: relative;
        }
        .word-item.selected {
            border-color: var(--accent-border);
            background: var(--accent-soft);
        }
        .word-item.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 2px;
            background: var(--accent);
            border-radius: 0 2px 2px 0;
        }
        .word-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
            margin-top: 0.15rem;
        }

        .word-text {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
            flex: 1;
            line-height: 1.5;
        }

        .word-en {
            font-weight: 700;
            color: var(--text-en);
            font-size: clamp(0.9rem, 3.6vw, 1rem);
            word-break: break-word;
            overflow-wrap: anywhere;
            letter-spacing: 0.01em;
            line-height: 1.4;
        }

        .word-sep {
            display: none;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
            opacity: 0.7;
            user-select: none;
        }

        .word-pl {
            color: var(--text-pl);
            font-size: clamp(0.85rem, 3.4vw, 0.95rem);
            font-weight: 500;
            word-break: break-word;
            overflow-wrap: anywhere;
            letter-spacing: 0.01em;
            line-height: 1.5;
        }

        .progress {
            font-size: clamp(0.75rem, 3vw, 0.9rem);
            color: var(--text-dim);
            margin-top: 0.8rem;
            text-align: center;
        }

        .test-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        .test-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem 1rem;
            width: 100%;
            text-align: center;
        }
        .test-question {
            font-size: clamp(1.1rem, 4.8vw, 1.5rem);
            font-weight: 700;
            margin-bottom: 1.1rem;
            color: var(--text-en);
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.4;
            letter-spacing: 0.01em;
        }
        .test-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .test-option {
            padding: 0.9rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-en);
            font-size: clamp(0.9rem, 3.7vw, 1.05rem);
            font-weight: 500;
            text-align: left;
            font-family: inherit;
            min-height: 50px;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.45;
            letter-spacing: 0.01em;
        }
        .test-option:active:not(:disabled) { transform: scale(0.98); }
        .test-option:hover:not(:disabled) {
            border-color: var(--accent-border);
            background: var(--accent-soft);
        }
        .test-option.correct {
            background: var(--success-bg);
            border-color: var(--success);
            color: #7dd99a;
            font-weight: 600;
        }
        .test-option.wrong {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: #e88a86;
        }
        .test-option:disabled { cursor: default; }
        .test-option.correct:disabled,
        .test-option.wrong:disabled { opacity: 1; }

        /* ============================================
           TRYB WPISYWANIA
           ============================================ */
        .input-test {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }
        .input-field {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-en);
            font-size: clamp(1rem, 4vw, 1.15rem);
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            letter-spacing: 0.01em;
            text-align: center;
            outline: none;
        }
        .input-field::placeholder {
            color: var(--text-dim);
            font-weight: 400;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .input-field.correct {
            border-color: var(--success);
            background: var(--success-bg);
            color: #7dd99a;
        }
        .input-field.wrong {
            border-color: var(--danger);
            background: var(--danger-bg);
            color: #e88a86;
        }
        .input-field:disabled {
            opacity: 0.9;
            cursor: default;
        }

        .input-feedback {
            min-height: 1.4rem;
            font-size: clamp(0.85rem, 3.4vw, 0.95rem);
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
        }
        .input-feedback.correct { color: #7dd99a; }
        .input-feedback.wrong { color: #e88a86; }
        .input-feedback .label {
            color: var(--text-dim);
            font-weight: 400;
            margin-right: 0.3rem;
        }

        .input-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.85rem 1.5rem;
            background: var(--accent);
            color: #1a1a1a;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            font-family: inherit;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:active { transform: scale(0.97); }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--card-hover, #333);
            border-color: var(--accent-border);
            color: var(--accent);
        }

        .score {
            font-size: clamp(1rem, 4vw, 1.15rem);
            margin-top: 0.8rem;
            color: var(--accent);
            font-weight: 600;
        }
        .empty {
            text-align: center;
            color: var(--text-dim);
            padding: 1.5rem 1rem;
            font-size: 0.95rem;
        }
        .end-icon {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        /* Kbd hint */
        .kbd-hint {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 0.4rem;
        }
        .kbd-hint kbd {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            font-family: inherit;
            font-size: 0.75rem;
        }

        @media (max-width: 380px) {
            body { padding-left: 0.5rem; padding-right: 0.5rem; }
            .tab { padding: 0.45rem 0.4rem; }
            .word-item { padding: 0.75rem 0.7rem; gap: 0.6rem; }
            .test-card { padding: 1rem 0.8rem; }
            .test-option { padding: 0.8rem 0.85rem; }
        }

        @media (min-width: 600px) {
            .word-text {
                flex-direction: row;
                align-items: baseline;
                gap: 0.6rem;
                flex-wrap: wrap;
            }
            .word-en {
                flex-shrink: 0;
                min-width: 200px;
                max-width: 45%;
            }
            .word-sep {
                display: inline;
            }
            .word-pl {
                flex: 1;
                min-width: 0;
            }
            .test-card { padding: 1.8rem; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            h1 { margin-bottom: 0.5rem; font-size: 1rem; }
            .tabs { margin-bottom: 0.6rem; }
            .test-card { padding: 0.9rem; }
            .test-question { margin-bottom: 0.6rem; }
            .test-options { gap: 0.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            Fiszki IT – Słownictwo z zeszytu
        </h1>

        <div class="tabs">
            <button class="tab active" data-panel="list">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                Lista
            </button>
            <button class="tab" data-panel="test-en-pl">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
                EN → PL
            </button>
            <button class="tab" data-panel="test-pl-en">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                PL → EN
            </button>
            <button class="tab" data-panel="type-en-pl">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
                EN → PL (wpisz)
            </button>
            <button class="tab" data-panel="type-pl-en">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
                PL → EN (wpisz)
            </button>
        </div>

        <div id="list" class="panel active">
            <div class="word-list" id="wordList"></div>
            <p class="progress" id="progressList"></p>
        </div>

        <div id="test-en-pl" class="panel">
            <div class="test-container" id="testEnPl"></div>
        </div>

        <div id="test-pl-en" class="panel">
            <div class="test-container" id="testPlEn"></div>
        </div>

        <div id="type-en-pl" class="panel">
            <div class="test-container" id="typeEnPl"></div>
        </div>

        <div id="type-pl-en" class="panel">
            <div class="test-container" id="typePlEn"></div>
        </div>
    </div>

    <script>
        // ===== SŁÓWKA ZE ZDJĘĆ ZESZYTU =====
        const vocabulary = [
            { en: "accelerate", pl: "przyspieszać" },
            { en: "aggregated data", pl: "zagregowane dane" },
            { en: "challenger", pl: "pretendent / konkurent" },
            { en: "cleansing process", pl: "proces czyszczenia (danych)" },
            { en: "computation", pl: "obliczenie" },
            { en: "conformed dimension table", pl: "uzgodniona tabela wymiarów" },
            { en: "cross-selling", pl: "sprzedaż krzyżowa" },
            { en: "dashboard", pl: "pulpit nawigacyjny / kokpit" },
            { en: "DAX", pl: "Data Analysis Expressions" },
            { en: "data scrubbing / cleansing", pl: "czyszczenie danych" },
            { en: "data validation", pl: "walidacja danych" },
            { en: "denormalize", pl: "denormalizować" },
            { en: "detect", pl: "wykrywać" },
            { en: "dimension table", pl: "tabela wymiarów" },
            { en: "encompass", pl: "obejmować" },
            { en: "ETL process", pl: "proces Extract, Transform, Load – wyodrębnianie, przekształcanie i ładowanie danych" },
            { en: "executive", pl: "stanowisko kierownicze / dyrektor" },
            { en: "forecast", pl: "prognoza / prognozować" },
            { en: "fragmented", pl: "pofragmentowany" },
            { en: "guesstimate", pl: "szacować „na oko” (połączenie guess + estimate)" },
            { en: "inconsistent", pl: "niespójny" },
            { en: "leverage customer data", pl: "wykorzystywać dane klientów" },
            { en: "MDX", pl: "Multidimensional Expressions" },
            { en: "MOLAP", pl: "Multidimensional Online Analytical Processing" },
            { en: "offload", pl: "odciążyć / przenieść dane" },
            { en: "out-innovate", pl: "prześcignąć w innowacjach (różnica w stosunku do out-perform)" },
            { en: "out-perform", pl: "osiągać lepsze wyniki" },
            { en: "SSBI", pl: "Self-Service Business Intelligence" },
            { en: "SCD", pl: "Slowly Changing Dimension" },
            { en: "sound business decisions", pl: "trafne/rozsądne decyzje biznesowe" },
            { en: "state", pl: "stan / określać" },
            { en: "meaningless key / surrogate key", pl: "klucz sztuczny / klucz zastępczy" },
            { en: "time variant", pl: "zależny od czasu / zmienny w czasie" }
        ];

        const STORAGE_KEY = 'fiszki_it_zeszyt_selected';

        function loadSelected() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.length === vocabulary.length) return parsed;
                } catch (e) {}
            }
            return vocabulary.map(() => true);
        }
        let selected = loadSelected();

        function saveSelected() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(selected));
        }

        // --- Normalizacja odpowiedzi ---
        // Usuwa polskie znaki diakrytyczne, interpunkcję, nadmiarowe spacje, lowercase
        function normalize(str) {
            return str
                .toLowerCase()
                .trim()
                .replace(/ą/g, 'a')
                .replace(/ć/g, 'c')
                .replace(/ę/g, 'e')
                .replace(/ł/g, 'l')
                .replace(/ń/g, 'n')
                .replace(/ó/g, 'o')
                .replace(/ś/g, 's')
                .replace(/[żź]/g, 'z')
                .replace(/[^a-z0-9\s\/\-]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Sprawdza czy odpowiedź pasuje do tłumaczenia
        // Obsługuje warianty rozdzielone "/" oraz tekst w nawiasach
        function isAnswerCorrect(userAnswer, correctAnswer) {
            const user = normalize(userAnswer);
            if (!user) return false;

            // Podziel poprawną odpowiedź na warianty (po "/")
            const variants = correctAnswer
                .split('/')
                .map(v => v.trim())
                .filter(Boolean);

            for (const variant of variants) {
                // Usuń nawiasy i ich zawartość dla porównania
                const cleanVariant = variant.replace(/\(.*?\)/g, '').trim();
                const normalizedVariant = normalize(cleanVariant);
                if (!normalizedVariant) continue;

                // Dokładne dopasowanie
                if (user === normalizedVariant) return true;

                // Dopasowanie bez myślników (np. "out perform" = "out-perform")
                if (user.replace(/\s/g, '') === normalizedVariant.replace(/\s/g, '')) return true;
            }
            return false;
        }

        function renderList() {
            const list = document.getElementById('wordList');
            list.innerHTML = '';
            vocabulary.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'word-item' + (selected[i] ? ' selected' : '');
                div.innerHTML = `
                    <input type="checkbox" ${selected[i] ? 'checked' : ''} data-index="${i}">
                    <span class="word-text">
                        <span class="word-en">${item.en}</span>
                        <span class="word-sep">→</span>
                        <span class="word-pl">${item.pl}</span>
                    </span>
                `;
                div.querySelector('input').addEventListener('change', (e) => {
                    selected[i] = e.target.checked;
                    div.classList.toggle('selected', selected[i]);
                    saveSelected();
                    updateProgress();
                });
                list.appendChild(div);
            });
            updateProgress();
        }

        function updateProgress() {
            const count = selected.filter(Boolean).length;
            document.getElementById('progressList').textContent = `Zaznaczono: ${count} / ${vocabulary.length}`;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ============================================
        // TEST WYBORU (multiple choice)
        // ============================================
        function createTest(containerId, direction) {
            const container = document.getElementById(containerId);
            const activeVocab = vocabulary.filter((_, i) => selected[i]);
            if (activeVocab.length === 0) {
                container.innerHTML = '<p class="empty">Zaznacz przynajmniej jedno słówko w liście.</p>';
                return;
            }

            let currentIndex = 0;
            let score = 0;
            let answered = false;

            function renderQuestion() {
                if (currentIndex >= activeVocab.length) {
                    container.innerHTML = `
                        <div class="test-card">
                            <svg class="end-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="6"/>
                                <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
                            </svg>
                            <h2 class="test-question">Koniec testu!</h2>
                            <p class="score">Wynik: ${score} / ${activeVocab.length}</p>
                            <button class="btn" onclick="location.reload()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 4 23 10 17 10"/>
                                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                                </svg>
                                Od nowa
                            </button>
                        </div>
                    `;
                    return;
                }

                const item = activeVocab[currentIndex];
                const question = direction === 'en-pl' ? item.en : item.pl;
                const correct = direction === 'en-pl' ? item.pl : item.en;

                const others = vocabulary.filter(v => v !== item);
                const wrongs = shuffle(others).slice(0, 3).map(v => direction === 'en-pl' ? v.pl : v.en);
                const options = shuffle([correct, ...wrongs]);

                container.innerHTML = `
                    <div class="test-card">
                        <div class="test-question">${question}</div>
                        <div class="test-options">
                            ${options.map(opt => `<button class="test-option" data-opt="${opt.replace(/"/g, '&quot;')}">${opt}</button>`).join('')}
                        </div>
                        <p class="progress">Pytanie ${currentIndex + 1} z ${activeVocab.length} | Wynik: ${score}</p>
                    </div>
                `;

                answered = false;
                container.querySelectorAll('.test-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (answered) return;
                        answered = true;
                        const chosen = btn.dataset.opt;
                        if (chosen === correct) {
                            btn.classList.add('correct');
                            score++;
                        } else {
                            btn.classList.add('wrong');
                            container.querySelectorAll('.test-option').forEach(b => {
                                if (b.dataset.opt === correct) b.classList.add('correct');
                            });
                        }
                        container.querySelectorAll('.test-option').forEach(b => b.disabled = true);
                        setTimeout(() => {
                            currentIndex++;
                            renderQuestion();
                        }, 1200);
                    });
                });
            }

            renderQuestion();
        }

        // ============================================
        // TEST WPISYWANIA (typing)
        // ============================================
        function createTypingTest(containerId, direction) {
            const container = document.getElementById(containerId);
            const activeVocab = vocabulary.filter((_, i) => selected[i]);
            if (activeVocab.length === 0) {
                container.innerHTML = '<p class="empty">Zaznacz przynajmniej jedno słówko w liście.</p>';
                return;
            }

            let currentIndex = 0;
            let score = 0;
            let answered = false;

            function renderQuestion() {
                if (currentIndex >= activeVocab.length) {
                    container.innerHTML = `
                        <div class="test-card">
                            <svg class="end-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="6"/>
                                <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
                            </svg>
                            <h2 class="test-question">Koniec testu!</h2>
                            <p class="score">Wynik: ${score} / ${activeVocab.length}</p>
                            <button class="btn" onclick="location.reload()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 4 23 10 17 10"/>
                                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                                </svg>
                                Od nowa
                            </button>
                        </div>
                    `;
                    return;
                }

                const item = activeVocab[currentIndex];
                const question = direction === 'en-pl' ? item.en : item.pl;
                const correct = direction === 'en-pl' ? item.pl : item.en;
                const placeholder = direction === 'en-pl' ? 'Wpisz tłumaczenie po polsku...' : 'Wpisz słowo po angielsku...';

                container.innerHTML = `
                    <div class="test-card">
                        <div class="test-question">${question}</div>
                        <div class="input-test">
                            <input
                                type="text"
                                class="input-field"
                                id="answerInput"
                                placeholder="${placeholder}"
                                autocomplete="off"
                                autocorrect="off"
                                autocapitalize="off"
                                spellcheck="false"
                            >
                            <div class="input-feedback" id="feedback"></div>
                            <div class="input-actions">
                                <button class="btn" id="submitBtn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                    Sprawdź
                                </button>
                                <button class="btn btn-secondary" id="skipBtn">Pomiń</button>
                            </div>
                            <p class="kbd-hint">Naciśnij <kbd>Enter</kbd>, aby zatwierdzić</p>
                        </div>
                        <p class="progress">Pytanie ${currentIndex + 1} z ${activeVocab.length} | Wynik: ${score}</p>
                    </div>
                `;

                const input = document.getElementById('answerInput');
                const feedback = document.getElementById('feedback');
                const submitBtn = document.getElementById('submitBtn');
                const skipBtn = document.getElementById('skipBtn');

                answered = false;
                input.focus();

                function submit() {
                    if (answered) return;
                    const userAnswer = input.value;
                    if (!userAnswer.trim()) return; // puste pole - nie zatwierdzaj

                    answered = true;
                    input.disabled = true;
                    submitBtn.disabled = true;
                    skipBtn.disabled = true;

                    const isCorrect = isAnswerCorrect(userAnswer, correct);

                    if (isCorrect) {
                        input.classList.add('correct');
                        feedback.classList.add('correct');
                        feedback.innerHTML = '<span class="label">✓</span> Dobrze!';
                        score++;
                    } else {
                        input.classList.add('wrong');
                        feedback.classList.add('wrong');
                        feedback.innerHTML = `<span class="label">✗ Poprawna odpowiedź:</span> ${correct}`;
                    }

                    setTimeout(() => {
                        currentIndex++;
                        renderQuestion();
                    }, isCorrect ? 900 : 1800);
                }

                function skip() {
                    if (answered) return;
                    answered = true;
                    input.disabled = true;
                    submitBtn.disabled = true;
                    skipBtn.disabled = true;

                    input.classList.add('wrong');
                    feedback.classList.add('wrong');
                    feedback.innerHTML = `<span class="label">Pominięto. Poprawna odpowiedź:</span> ${correct}`;

                    setTimeout(() => {
                        currentIndex++;
                        renderQuestion();
                    }, 1800);
                }

                submitBtn.addEventListener('click', submit);
                skipBtn.addEventListener('click', skip);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        submit();
                    }
                });
            }

            renderQuestion();
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.panel).classList.add('active');

                const panel = tab.dataset.panel;
                if (panel === 'test-en-pl') createTest('testEnPl', 'en-pl');
                if (panel === 'test-pl-en') createTest('testPlEn', 'pl-en');
                if (panel === 'type-en-pl') createTypingTest('typeEnPl', 'en-pl');
                if (panel === 'type-pl-en') createTypingTest('typePlEn', 'pl-en');
            });
        });

        renderList();
    </script>
</body>
</html>
